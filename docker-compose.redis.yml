# Redis para rate limit compartilhado entre réplicas.
# Uso (com escala):
#   docker compose -f docker-compose.yml -f docker-compose.scale.yml -f docker-compose.redis.yml \
#     up -d --build --scale api=3

name: automacao-industrial

services:
  redis:
    image: redis:7-alpine
    container_name: automacao-industrial-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    depends_on:
      redis:
        condition: service_healthy
    environment:
      RATE_LIMIT_BACKEND: redis
      REDIS_URL: redis://redis:6379/0

volumes:
  redis_data:
