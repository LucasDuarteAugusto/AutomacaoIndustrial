default_install_hook_types: [pre-commit, pre-push]

# Arquivos gerados (contrato, cliente Orval, árvore de rotas, lockfile) não são reescritos pelos hooks.
exclude: ^frontend/(openapi\.json|pnpm-lock\.yaml|src/api/gerado/|src/routeTree\.gen\.ts)

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: no-commit-to-branch
        args: [--branch, development, --branch, master, --branch, main]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.13.1
    hooks:
      - id: uv-lock
        args: [--project, backend]
        files: ^backend/(pyproject\.toml|uv\.lock)$

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run --directory backend mypy
        language: system
        types: [python]
        files: ^backend/
        pass_filenames: false
        stages: [pre-push]

      - id: frontend-prettier
        name: prettier (frontend)
        entry: pnpm --dir frontend format:check
        language: system
        files: ^frontend/
        pass_filenames: false

      - id: frontend-typecheck
        name: tsc (frontend)
        entry: pnpm --dir frontend typecheck
        language: system
        files: ^frontend/
        pass_filenames: false
        stages: [pre-push]

      - id: frontend-eslint
        name: eslint (frontend)
        entry: pnpm --dir frontend lint
        language: system
        files: ^frontend/
        pass_filenames: false
        stages: [pre-push]
